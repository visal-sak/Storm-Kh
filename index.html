<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>StormWatch Kampuchea - Cambodia Cyclone Monitor</title>
    <script>
      // Applies the saved theme before first paint so a dark-mode reload never
      // flashes the light palette. Light is the default when nothing is stored.
      try {
        if (localStorage.getItem("stormwatch-theme") === "dark") {
          document.documentElement.classList.add("dark")
        }
      } catch {
        /* private mode — fall through to the light default */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist carries Latin, Kantumruy Pro carries Khmer; the browser falls
         back per glyph, so mixed-script lines stay correct in one font stack. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Kantumruy+Pro:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
