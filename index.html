<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>StormWatch Kampuchea - Cambodia Cyclone Monitor</title>
    <meta
      name="description"
      content="Live tropical cyclone and weather monitor for Cambodia. All 25 provinces with real-time weather, air quality, rain and lightning on the map, real NASA EONET storm tracks, and Khmer-first alerts."
    />

    <!-- Link previews. og:image must be an absolute URL — crawlers do not
         resolve relative paths, so a bare /strom.png silently yields no
         thumbnail on Facebook, Telegram, Messenger, Slack or Discord. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StormWatch Kampuchea" />
    <meta property="og:url" content="https://strom-kh.netlify.app/" />
    <meta property="og:title" content="StormWatch Kampuchea · ប្រព័ន្ធតាមដានព្យុះ" />
    <meta
      property="og:description"
      content="Live tropical cyclone and weather monitor for Cambodia. All 25 provinces with real-time weather, air quality, rain and lightning on the map, real NASA EONET storm tracks, and Khmer-first alerts."
    />
    <meta property="og:image" content="https://strom-kh.netlify.app/strom.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1901" />
    <meta property="og:image:height" content="927" />
    <meta
      property="og:image:alt"
      content="StormWatch Kampuchea dashboard: a map of Cambodia with province markers, an active cyclone over the South China Sea, and per-province weather cards."
    />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="km_KH" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StormWatch Kampuchea · ប្រព័ន្ធតាមដានព្យុះ" />
    <meta
      name="twitter:description"
      content="Live cyclone and weather monitor for Cambodia — 25 provinces, real NASA EONET storm tracks, Khmer-first alerts."
    />
    <meta name="twitter:image" content="https://strom-kh.netlify.app/strom.png" />
    <meta
      name="twitter:image:alt"
      content="StormWatch Kampuchea dashboard showing Cambodia's provinces and an active cyclone."
    />
    <script>
      // Applies the saved theme before first paint so a dark-mode reload never
      // flashes the light palette. Light is the default when nothing is stored.
      try {
        if (localStorage.getItem("stormwatch-theme") === "dark") {
          document.documentElement.classList.add("dark")
        }
      } catch {
        /* private mode — fall through to the light default */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist carries Latin, Kantumruy Pro carries Khmer; the browser falls
         back per glyph, so mixed-script lines stay correct in one font stack. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Kantumruy+Pro:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
